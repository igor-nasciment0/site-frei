    delete:
      tags: [AdminPanel]
      summary: Remove um registro de ex-aluno
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Registro removido
          content:
            application/json:
              schema:
                type: boolean
        '404':
