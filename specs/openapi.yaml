        items: { type: array, items: { $ref: '#/components/schemas/FormerStudentDto' } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    # -------- Cupons de desconto --------
    CouponDto:
      type: object
      properties:
        id: { type: string }
        code: { type: string, description: 'Maiúsculas, sem espaços' }
        description: { type: string }
        discountType:
          $ref: '#/components/schemas/CouponDiscountType'
        discountValue: { type: number, format: double }
        validFrom: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean }
        maxUses: { type: integer, nullable: true, description: Nulo = ilimitado }
        usedCount: { type: integer, description: Inscrições com cobrança emitida ou pagamento registrado com o cupom }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }

    AdminCreateOrUpdateCouponDto:
      type: object
      required: [code, discountType, discountValue]
      properties:
        code: { type: string, maxLength: 40 }
        description: { type: string, nullable: true }
        discountType:
          $ref: '#/components/schemas/CouponDiscountType'
        discountValue:
          type: number
          format: double
          description: 'Percentual: maior que 0 e até 100. Valor fixo: maior que 0, em reais.'
        validFrom: { type: string, format: date-time, nullable: true, description: 'Inclusive; comparado por dia' }
        validUntil: { type: string, format: date-time, nullable: true, description: 'Inclusive; comparado por dia' }
        isActive: { type: boolean, default: true }
        maxUses: { type: integer, nullable: true, minimum: 1 }

    # -------- Matriz de compatibilidade --------
    AdminCourseCompatibilityMatrixDto:
      type: object
      properties:
        courses:
          type: array
          description: Cursos ativos (linhas = 1ª opção, colunas = 2ª opção).
          items: { $ref: '#/components/schemas/CompatibilityCourseDto' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CourseCompatibilityRowDto' }
        schoolLevels:
          type: array
          description: Escolaridades aceitas nas condições, em ordem crescente.
          items: { type: string }
        continuityCourseCodes:
          type: array
          description: Cursos com continuidade — só neles alguém pode ser "aluno interno".
          items: { type: integer }

    CompatibilityCourseDto:
      type: object
      properties:
        code: { type: integer }
        name: { type: string }
        type: { type: string, nullable: true }
        periods:
          type: array
          items:
            type: object
            properties:
              code: { type: integer }
              name: { type: string }
        defaultEarliestBirthDate: { type: string, format: date-time, nullable: true }
        defaultLatestBirthDate: { type: string, format: date-time, nullable: true }
        defaultMinSchoolLevel: { type: string, nullable: true }
        courseSchoolLevelText: { type: string, description: "Texto livre de escolaridade do cadastro, para conferência." }

    CourseCompatibilityRowDto:
      type: object
      properties:
        firstCourseCode: { type: integer }
        secondChoiceRequirement: { $ref: '#/components/schemas/SecondChoiceRequirement' }
        allowedSecondChoices:
          type: array
          items: { $ref: '#/components/schemas/SecondChoiceRuleDto' }
        modifiedAt: { type: string, format: date-time, nullable: true }
        modifiedBy: { type: string, nullable: true }

    SecondChoiceRuleDto:
      type: object
      description: Célula liberada. `courseCode` igual ao da linha = mesmo curso em outro período.
      properties:
        courseCode: { type: integer }
        allowInternal: { type: boolean, default: true }
        allowExternal: { type: boolean, default: true }
        periodRules:
          type: array
          items: { $ref: '#/components/schemas/CellPeriodRuleDto' }

    CellPeriodRuleDto:
      type: object
      description: Condição da célula para um período do curso da 1ª opção.
      properties:
        firstPeriodCode: { type: integer }
        earliestBirthDate: { type: string, format: date-time, description: "Nascido a partir de (inclusiva). Obrigatória ao salvar." }
        latestBirthDate: { type: string, format: date-time, description: "Nascido até (inclusiva). Obrigatória ao salvar." }
        minSchoolLevel: { type: string, nullable: true }
        disabledSecondPeriodCodes:
          type: array
          items: { type: integer }

    SaveCourseCompatibilityMatrixDto:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/CourseCompatibilityRowDto' }

    AdminResetUserPasswordDto:
      type: object
      properties:
        newPassword:
          type: string
          nullable: true
          description: Se vazio/ausente, o backend gera uma senha aleatória.

    AdminResetUserPasswordResultDto:
      type: object
      properties:
        success:
          type: boolean
        newPassword:
          type: string
          description: Senha em texto plano (gerada ou informada) — exibir uma única vez ao admin.

    AdminAccountListItemDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        cpf:
          type: string
        phone:
          type: string
        birthDate:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        latestEnrollmentProtocol:
          type: string
          nullable: true
          description: Protocolo da inscrição mais recente; nulo quando a conta nunca se inscreveu.

    AdminAccountListResultDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccountListItemDto'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    AdminAccountEnrollmentDto:
      type: object
      properties:
        id:
          type: string
        protocol:
          type: string
        status:
          type: string
          enum: [Open, Validated, Canceled]
        firstChoiceCourseName:
          type: string
        firstChoicePeriodName:
          type: string
        createdAt:
          type: string
          format: date-time

    AdminAccountDetailDto:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/UserDto'
        enrollments:
          type: array
          description: Inscrições da conta, da mais recente para a mais antiga.
          items:
            $ref: '#/components/schemas/AdminAccountEnrollmentDto'
        emailChanges:
          type: array
          items:
            $ref: '#/components/schemas/AdminEmailChangeDto'
        cpfChanges:
          type: array
          items:
            $ref: '#/components/schemas/AdminCpfChangeDto'
