# CÓPIA — a fonte da verdade é nsf-app-v3/specs/openapi.yaml (repositório da API).
# Não edite aqui: altere lá e copie de novo (cp nsf-app-v3/specs/openapi.yaml frei/specs/openapi.yaml,
# mantendo este cabeçalho). Última sincronização: 2026-10-12.
openapi: 3.0.3
info:
  title: NSF API v3
  description: >
    API REST do Instituto Social N.S.Fátima para gestão de usuários, cursos,
    inscrições (matrículas) e agendamentos do vestibular.
    Gerado a partir do código-fonte real (`src/NsfApi/Controllers`); conferido contra o código em 2026-10-12.
    Enums são serializados como número, salvo onde o schema diz o contrário.
    Ver também `specs/architecture.md`, `specs/features-usecases.md` e `specs/modeling.md`
    para detalhes de arquitetura, regras de negócio e modelagem de dados.
  version: "3.0.0"
  contact:
    name: NSF Vestibular
servers:
  - url: https://api.vestibular-insf.com.br
    description: Produção
  - url: http://localhost:5000
    description: Desenvolvimento local

tags:
  - name: Users
    description: Cadastro, autenticação e perfil de usuários
  - name: Courses
    description: Consulta de cursos disponíveis
  - name: Enrollments
    description: Inscrições/matrículas no vestibular
  - name: Appointments
    description: Agendamento de prova/entrevista
  - name: FAQs
    description: Perguntas frequentes
  - name: Payments
    description: Cobrança PIX da taxa de inscrição (EduTech PIX API) e consulta do pagamento
  - name: Parameters
    description: Status/parâmetros do vestibular vigente
  - name: AdminPanel
    description: >
      Painel administrativo (`/api/admin`): autenticação de administradores
      via coleção própria (`admins`, separada de `users`). JWT próprio, com
      validade de 8 horas e claim `Role` = `Admin`, `Secretaria` ou
      `Financeiro` (distinto do token de usuário final, que sempre recebe
      `Role="User"`). Cada operação informa em `x-roles` os perfis aceitos;
      fora deles a resposta é `403`. Ver `POST /api/admin/auth/login`.

security:
  - bearerAuth: []

paths:
  # ===================== USERS =====================
  /api/users:
    post:
      tags: [Users]
      summary: Cria um novo usuário
      description: >
        Cadastra um novo usuário. Se já existir um usuário inativo com o
        mesmo CPF, a conta é reativada (nome/email/senha/idade são
        atualizados) em vez de criar um novo registro.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserCommand'
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email ou CPF já existente
        '500':
          description: Erro interno do servidor
    delete:
      tags: [Users]
      summary: Desativa a própria conta (soft-delete)
      description: >
        O id nunca vem do cliente — é sempre o do usuário autenticado (extraído do JWT),
        para que ninguém possa desativar a conta de outro candidato.
      responses:
        '200':
          description: Usuário desativado com sucesso
          content:
            application/json:
              schema:
                type: boolean
        '401':
          description: Token inválido ou ausente
        '404':
          description: Usuário não encontrado

  /api/users/login:
    post:
      tags: [Users]
      summary: Autentica um usuário e retorna token JWT
      description: >
        Recebe as credenciais como `multipart/form-data` (ou
        `application/x-www-form-urlencoded`), **não** como JSON.
        Mensagem de erro genérica para email inexistente/inativo ou senha
        incorreta, evitando enumeração de contas. Com as inscrições desligadas
        na edição ativa (`allowRegistration = false`), só e-mails de teste
        (`testerEmails`) conseguem entrar — os demais recebem `400` com
        "As inscrições ainda não começaram. Volte no dia {data}.".
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginCommand'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginCommand'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Credenciais inválidas, usuário inativo ou inscrições ainda não liberadas

  /api/users/profile:
    get:
      tags: [Users]
      summary: Obtém o perfil do usuário autenticado
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Token inválido ou ausente
    put:
      tags: [Users]
      summary: Atualiza o perfil do usuário autenticado
      description: >
        Atualização parcial — apenas campos não nulos de `UpdateUserDto` são alterados. Alterar
        nascimento ou escolaridade com inscrição na edição ativa **zera as opções de curso**
        (inscrição aberta e não paga) ou é **recusado com 400** (inscrição validada ou paga).
        `referral` (indicação, etapa 8) é opcional: nome e CPF vazios limpam a indicação;
        preenchendo um, os dois são obrigatórios e o CPF precisa ter 11 dígitos (`400`). Com
        `allowReferral` desligado na edição ativa (ou sem edição ativa) o campo é ignorado, sem
        erro. O cupom de desconto não passa por aqui — ver `/api/users/coupon`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: Perfil atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: Dados inválidos
        '401':
          description: Token inválido ou ausente
        '404':
          description: Usuário não encontrado

  /api/users/device-info:
    put:
      tags: [Users]
      summary: Atualiza as informações do aparelho do usuário autenticado
      description: >
        Substitui todo o objeto `DeviceInfo` (usado para registrar o token
        de push do Firebase Cloud Messaging — obs.: envio de notificações
        ainda não está conectado a nenhum fluxo de negócio).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceInfoDto'
      responses:
        '200':
          description: Informações do aparelho atualizadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: Dados inválidos
        '401':
          description: Token inválido ou ausente
        '404':
          description: Usuário não encontrado

  /api/users/forgot-password:
    post:
      tags: [Users]
      summary: Solicita recuperação de senha
      description: >
        Gera um código numérico de 6 dígitos válido por 15 minutos e envia
        por e-mail. Não revela se o e-mail existe (resposta sempre genérica).
        Se já existir uma solicitação pendente e válida, não gera outra.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordRecoveryDto'
      responses:
        '200':
          description: Solicitação processada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryResponseDto'
        '400':
          description: Dados inválidos

  /api/users/reset-password:
    post:
      tags: [Users]
      summary: Redefine a senha usando código de recuperação
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: Senha redefinida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryResponseDto'
        '400':
          description: Dados inválidos, código inválido ou expirado

  /api/users/change-password:
    post:
      tags: [Users]
      summary: Troca a senha do candidato autenticado
      description: >
        Exige a senha atual. Serve à troca voluntária e à obrigatória depois de um reset feito
        pelo painel (`UserDto.mustChangePassword = true`); em sucesso a flag é limpa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryResponseDto'
        '400':
          description: Senha atual incorreta ou usuário não encontrado (`success = false` no corpo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryResponseDto'
        '401':
          description: Token inválido ou ausente

  /api/users/rg-document:
    post:
      tags: [Users]
      summary: Envia (ou substitui) o anexo do RG do candidato
      description: >
        Obrigatório para concluir a inscrição. O arquivo é gravado no storage da API
        (volume Docker), não no MongoDB. Formatos aceitos: JPG, PNG, HEIC e PDF;
        tamanho máximo em `Storage:MaxUploadBytes` (4MB por padrão).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Anexo salvo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RgDocumentDto'
        '400':
          description: Arquivo ausente, grande demais ou em formato não aceito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token inválido ou ausente
    get:
      tags: [Users]
      summary: Baixa o anexo do RG do próprio candidato
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Arquivo do documento
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Nenhum anexo enviado

  /api/users/coupon:
    get:
      tags: [Users]
      summary: Situação do cupom de desconto aplicado pelo candidato
      description: >
        Revalida agora o cupom gravado no usuário e devolve desconto e valor final da taxa — ou
        `valid = false` com o motivo, se ele deixou de valer. Não altera nada. Usado pela etapa 8
        do formulário para recarregar o estado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cupom aplicado e a situação dele
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponValidationDto'
        '204':
          description: O candidato não tem cupom aplicado
        '401':
          description: Token inválido ou ausente
    post:
      tags: [Users]
      summary: Valida e aplica um cupom de desconto na taxa de inscrição
      description: >
        A validação é toda do backend. Cupom aceito fica gravado no usuário (`UserDto.coupon`) e o
        desconto entra na emissão da cobrança (`POST /api/enrollments/my-enrollment/payment`), que
        revalida o cupom. **Recusa não é erro HTTP**: responde `200` com `valid = false` e o
        motivo em `message`, e nada é alterado (um cupom aplicado antes continua valendo).
        Recusas, nesta ordem: edição ativa sem `allowCoupon` (ou sem edição ativa), código vazio,
        cupom inexistente, inativo, fora da validade, limite de usos atingido, candidato sem CPF
        e candidato que já foi aluno (CPF em `formerStudents` ou em `enrolledStudents`, qualquer
        ano) — "Este cupom é válido apenas para quem nunca foi aluno do Instituto.". Se já havia
        cobrança **pendente** emitida com outro cupom (ou sem cupom), ela é cancelada como no
        reset do painel (o `paymentCorrelationId` fica, e a próxima sai com sufixo e valor novo).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCouponDto'
      responses:
        '200':
          description: Resultado da validação (`valid` true ou false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponValidationDto'
        '400':
          description: Pagamento da inscrição já confirmado — o cupom não pode mais ser alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token inválido ou ausente
        '404':
          description: Usuário não encontrado
    delete:
      tags: [Users]
      summary: Remove o cupom de desconto do candidato
      description: >
        Permitido mesmo com `allowCoupon` desligado. Cobrança pendente emitida com desconto é
        cancelada (a próxima sai pelo valor cheio) e o uso contado do cupom é devolvido.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cupom removido (ou não havia cupom)
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Pagamento da inscrição já confirmado — o cupom não pode mais ser alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token inválido ou ausente
        '404':
          description: Usuário não encontrado

  # ===================== COURSES =====================
  /api/courses:
    get:
      tags: [Courses]
      summary: Lista todos os cursos ativos (resumo)
      responses:
        '200':
          description: Cursos retornados com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseSummaryDto'
        '500':
          description: Erro interno do servidor

  /api/courses/count:
    get:
      tags: [Courses]
      summary: Quantidade de cursos ativos
      description: >
        **Anônimo de propósito**: o painel institucional das telas públicas (login, cadastro,
        recuperação de senha) exibe esse número e ali não há token. Devolve só a contagem —
        nenhum dado de curso é exposto. `GET /api/courses` continua exigindo JWT.
      security: []
      responses:
        '200':
          description: Contagem retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCountDto'

  /api/courses/{id}:
    get:
      tags: [Courses]
      summary: Obtém um curso específico por ID (dados completos)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curso retornado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDto'
        '404':
          description: Curso não encontrado
        '500':
          description: Erro interno do servidor

  /api/courses/{id}/image:
    get:
      tags: [Courses]
      summary: Obtém a imagem do curso
      description: >
        Imagem servida a partir de arquivo em disco, não do banco de dados. Procura primeiro
        no storage em volume (`Storage:RootPath/course-images`, onde caem as imagens enviadas
        via `POST /api/admin/courses/{id}/image`) e, se não achar, cai para o arquivo legado
        colado na imagem Docker em build (`templates/images/{id}`).
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Imagem JPEG do curso
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Imagem não encontrada

  /api/courses/{id}/periods:
    get:
      tags: [Courses]
      summary: Lista os períodos/turnos disponíveis de um curso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de períodos do curso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoursePeriodDto'
        '404':
          description: Curso não encontrado

  # ===================== ENROLLMENTS =====================
  /api/enrollments:
    post:
      tags: [Enrollments]
      summary: Cria ou atualiza a inscrição do usuário no vestibular ativo
      description: >
        Se o usuário já possui inscrição no vestibular ativo e o status é
        `Open` **e** o pagamento da taxa ainda não foi confirmado, atualiza as escolhas; caso
        contrário retorna erro (inscrição já validada/cancelada, ou com pagamento já confirmado,
        não pode ser editada). Na primeira inscrição,
        gera um protocolo único no formato `{ano}{numeroSequencial:D4}` (`{ano}` = ano corrente
        do servidor, não o `year` da edição). Se a segunda opção é obrigatória, opcional ou não
        permitida — e quais cursos ela aceita — depende da primeira, pela matriz de compatibilidade
        do painel (`specs/rules/inscricao.md` seção 3.1). Com `allowRegistration = false`, só
        e-mails de teste criam ou editam inscrição.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentDto'
      responses:
        '200':
          description: Inscrição processada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentDto'
        '400':
          description: Dados inválidos
        '500':
          description: Erro interno do servidor

  /api/enrollments/validate-choices:
    post:
      tags: [Enrollments]
      summary: Pré-valida 1ª/2ª opção (e demais requisitos da inscrição) sem persistir nada
      description: >
        Roda o mesmo `CreateEnrollmentDtoValidator` usado em `POST /api/enrollments` — via
        injeção direta do `IValidator<T>`, sem passar pelo `IMediator`/handler — então nada é
        criado ou alterado. Existe pra o frontend avisar o candidato de incompatibilidade entre
        1ª/2ª opção (ou qualquer outro requisito: RG não anexado, mensalidades em aberto, idade,
        etc.) antes de ele clicar em "Concluir Inscrição", sem duplicar as regras em JS. O
        formulário de inscrição chama este endpoint com debounce a cada mudança de curso/período.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentDto'
      responses:
        '200':
          description: Resultado da validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentChoicesValidationDto'

  /api/enrollments/first-choice-options:
    get:
      tags: [Enrollments]
      summary: Cursos e períodos que o candidato pode usar como 1ª opção
      description: >
        Curso ativo, com linha na matriz de compatibilidade e com o nascimento do candidato dentro
        da faixa do cadastro; se a 2ª opção é obrigatória, só os períodos em que sobra alguma 2ª
        opção possível para ele.
      responses:
        '200':
          description: Opções de 1ª opção
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChoiceCourseOptionDto'

  /api/enrollments/second-choice-options:
    get:
      tags: [Enrollments]
      summary: O que a 1ª opção (curso e período) permite como 2ª, para o candidato
      parameters:
        - name: firstChoiceCourseCode
          in: query
          required: true
          schema:
            type: integer
        - name: firstChoicePeriodCode
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Opções de 2ª opção
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondChoiceOptionsDto'

  /api/enrollments/protocol/{protocol}:
    get:
      tags: [Enrollments]
      summary: Obtém uma inscrição pelo protocolo — só a do próprio candidato
      description: >
        Exige JWT e só devolve a inscrição se ela pertencer ao usuário autenticado
        (comparação por `UserId`). Protocolo é sequencial e previsível
        (`{ano}{sequencial:D4}`), então sem essa checagem qualquer candidato logado
        poderia varrer protocolos e ler a inscrição de outra pessoa.
      parameters:
        - name: protocol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inscrição retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentDto'
        '401':
          description: Token inválido ou ausente
        '404':
          description: Inscrição não encontrada (ou não pertence ao usuário autenticado)
        '500':
          description: Erro interno do servidor

  /api/enrollments/my-enrollment:
    get:
      tags: [Enrollments]
      summary: Obtém a inscrição do usuário autenticado no vestibular ativo
      description: >
        Retorna também `TestRoom`, `TestTime` e `TestDate`, preenchidos
        administrativamente após a fase de agendamento/validação.
      responses:
        '200':
          description: Inscrição retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentDto'
        '404':
          description: Inscrição não encontrada
        '500':
          description: Erro interno do servidor

  /api/enrollments/validate/{protocol}:
    post:
      tags: [Enrollments]
      summary: Valida uma inscrição por protocolo
      description: >
        ⚠️ **Sem uso**: exige `[Authorize(Roles="Admin")]`. O token do candidato
        nunca tem essa role; o token do painel com perfil Admin tecnicamente passa,
        mas nenhuma tela chama este endpoint. É o único caminho no código que leva
        uma inscrição a `Validated`.
      responses:
        '200':
          description: Inscrição validada com sucesso
        '400':
          description: Dados inválidos / falha ao validar
        '403':
          description: Acesso negado
        '500':
          description: Erro interno do servidor

  /api/enrollments/my-enrollment/payment:
    post:
      tags: [Payments]
      summary: Gera a cobrança PIX da taxa de inscrição
      description: >
        Emite a cobrança na EduTech com correlationID `insfvest_{ano}{protocolo}` e o valor
        configurado na edição ativa. Enquanto a cobrança estiver pendente e válida, devolve a
        mesma; reemite (com sufixo `_2`, `_3`…) só quando ela venceu ou foi cancelada — e,
        antes disso, confirma no provedor que ela não foi paga. Depois de paga, nunca reemite.
        O valor é `enrollmentFee` menos o desconto do cupom do candidato, revalidado na emissão
        (cupom que deixou de valer, ou edição com `allowCoupon` desligado: valor cheio, com o
        motivo em `couponNotice`). Cupom que zera a taxa não gera PIX: a inscrição volta já paga
        (`status = 2`, `amount = 0`, sem `correlationId` novo) e o e-mail de confirmação é enviado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cobrança vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPaymentDto'
        '400':
          description: Ano ou taxa de inscrição não configurados na edição ativa, ou inscrição sem curso escolhido
        '404':
          description: Sem vestibular ativo ou sem inscrição
        '502':
          description: Provedor de pagamento indisponível ou sem configuração

  /api/enrollments/my-enrollment/payment/status:
    get:
      tags: [Payments]
      summary: Consulta no provedor se a cobrança já foi paga
      description: >
        Consulta a cobrança vigente na EduTech pelo correlationID e grava a situação na
        inscrição. É o mecanismo de confirmação — a EduTech não tem webhook. Sem cobrança
        emitida, ou já paga, devolve o que está gravado sem consultar o provedor.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Situação atual da cobrança
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPaymentDto'
        '404':
          description: Sem vestibular ativo ou sem inscrição
        '502':
          description: Provedor de pagamento indisponível ou sem configuração

  # ===================== APPOINTMENTS =====================
  /api/appointments:
    post:
      tags: [Appointments]
      summary: Cria ou atualiza o agendamento de prova/entrevista do usuário logado
      description: >
        Exige vestibular ativo e inscrição `Open` do usuário nesse vestibular.
        Duração fixa de 60 minutos, limite de 40 pessoas por slot de
        data/hora, apenas dias úteis em horário comercial (08:00–17:30),
        respeitando feriados fixos cadastrados (⚠️ atualmente hard-coded
        somente para 2025). Um usuário só pode ter um agendamento — se já
        existir, a data é atualizada em vez de criar um novo registro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateAppointmentCommand'
      responses:
        '200':
          description: Agendamento criado/atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponseDto'

  /api/appointments/my:
    get:
      tags: [Appointments]
      summary: Consulta o agendamento do usuário logado
      responses:
        '200':
          description: Agendamento do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponseDto'
        '404':
          description: Nenhum agendamento encontrado para este usuário

  /api/appointments/available-dates:
    get:
      tags: [Appointments]
      summary: Consulta datas disponíveis para agendamento
      description: >
        Lista dias úteis não feriados entre hoje (ou o início do vestibular,
        o que for maior) e o fim do período de inscrição
        (`ExtensionDate ?? EndDate`).
      responses:
        '200':
          description: Datas disponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableAppointmentDatesDto'

  # ===================== FAQS =====================
  /api/faqs:
    get:
      tags: [FAQs]
      summary: Lista todas as FAQs ativas, ordenadas
      responses:
        '200':
          description: FAQs retornadas com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FAQDto'
        '500':
          description: Erro interno do servidor

  # ===================== PARAMETERS =====================
  /api/parameters:
    get:
      tags: [Parameters]
      summary: Obtém o status atual do vestibular
      description: >
        Retorna a fase corrente, mensagens contextuais e se as inscrições/resultado estão
        liberados. **Exige JWT** — a tela de login do frontend chama sem token e recebe 401
        (pendência registrada em `specs/divergencias.md`). Sem edição ativa → 400.
      responses:
        '200':
          description: Status do vestibular
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VestibularStatusDto'

  # ===================== ADMIN PANEL =====================
  /api/admin/auth/login:
    post:
      tags: [AdminPanel]
      summary: Autentica um administrador e retorna token JWT (Role="Admin")
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginCommand'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthResponseDto'
        '400':
          description: Credenciais inválidas

  /api/admin/auth/bootstrap:
    post:
      tags: [AdminPanel]
      summary: Cria o primeiro administrador do sistema
      description: >
        Só funciona enquanto a coleção `admins` estiver vazia (verifica via
        `IAdminUserRepository.AnyAsync`); exige a senha fixa `AccessPassword.Admin`
        (`NsfApi.Domain/AccessPassword.cs`) como segredo de bootstrap — único uso
        restante dessa senha fixa desde que os endpoints legados/admin por
        querystring foram removidos (2026-09-28). Após o primeiro
        administrador existir, use `POST /api/admin/users` (autenticado)
        para criar os demais.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapAdminCommand'
      responses:
        '201':
          description: Administrador criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDto'
        '400':
          description: Dados inválidos ou senha administrativa incorreta
        '409':
          description: Já existe um administrador cadastrado

  /api/admin/auth/change-password:
    post:
      tags: [AdminPanel]
      summary: O administrador logado troca a própria senha
      x-roles: [Admin, Secretaria, Financeiro]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordDto'
      responses:
        '200':
          description: "Senha alterada (`{ success: true }`)"
        '400':
          description: Senha atual incorreta, nova senha com menos de 8 caracteres ou igual à atual

  /api/admin/users:
    get:
      tags: [AdminPanel]
      summary: Lista os administradores, por nome
      x-roles: [Admin]
      responses:
        '200':
          description: Administradores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserDto'
    post:
      tags: [AdminPanel]
      summary: Cria um novo administrador, com perfil
      x-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminUserCommand'
      responses:
        '201':
          description: Administrador criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDto'
        '400':
          description: Dados inválidos
        '401':
          description: Token inválido ou ausente
        '403':
          description: Token sem Role="Admin"

  /api/admin/users/{id}/reset-password:
    post:
      tags: [AdminPanel]
      summary: Gera uma senha aleatória para outro administrador
      description: Senha de 12 caracteres, devolvida uma única vez; obriga a troca no próximo login.
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Senha resetada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResetUserPasswordResultDto'
        '404':
          description: Administrador não encontrado

  /api/admin/courses:
    get:
      tags: [AdminPanel]
      summary: Lista todos os cursos, incluindo inativos
      x-roles: [Admin]
      responses:
        '200':
          description: Cursos retornados com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCourseDto'
        '401':
          description: Token inválido ou ausente
        '403':
          description: Token sem Role="Admin"
    post:
      tags: [AdminPanel]
      summary: Cria um novo curso
      x-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateOrUpdateCourseDto'
      responses:
        '201':
          description: Curso criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDto'
        '401':
          description: Token inválido ou ausente
        '403':
          description: Token sem Role="Admin"

  /api/admin/courses/{id}:
    get:
      tags: [AdminPanel]
      summary: Obtém um curso por ID, incluindo inativos
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curso retornado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDto'
        '404':
          description: Curso não encontrado
    put:
      tags: [AdminPanel]
      summary: Atualiza um curso existente
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateOrUpdateCourseDto'
      responses:
        '200':
          description: Curso atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDto'
        '404':
          description: Curso não encontrado
    delete:
      tags: [AdminPanel]
      summary: Desativa um curso (soft-delete)
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curso desativado com sucesso
          content:
            application/json:
              schema:
                type: boolean
        '404':
          description: Curso não encontrado

  /api/admin/courses/{id}/image:
    post:
      tags: [AdminPanel]
      summary: Envia (ou substitui) a imagem de capa do curso
      x-roles: [Admin]
      description: >
        Grava o arquivo no storage em volume (mesma base usada pelo anexo do RG —
        `Storage:RootPath`, subpasta `course-images`), diferente das 18 imagens
        originais coladas na imagem Docker em build (`templates/images/`). `GET
        /api/courses/{id}/image` passa a servir da nova pasta primeiro, com
        fallback para o arquivo legado em disco — sem precisar migrar nada.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Imagem salva; curso atualizado com o novo identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseDto'
        '400':
          description: Arquivo ausente, grande demais (limite `Storage:MaxUploadBytes`, 4MB por padrão) ou em formato não aceito (JPG/PNG/WEBP)
        '404':
          description: Curso não encontrado

  /api/admin/faqs:
    get:
      tags: [AdminPanel]
      summary: Lista todas as FAQs, incluindo inativas
      x-roles: [Admin]
      responses:
        '200':
          description: FAQs retornadas com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FAQDto'
    post:
      tags: [AdminPanel]
      summary: Cria uma nova FAQ
      x-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateOrUpdateFAQDto'
      responses:
        '201':
          description: FAQ criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAQDto'

  /api/admin/faqs/{id}:
    get:
      tags: [AdminPanel]
      summary: Obtém uma FAQ por ID, incluindo inativas
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: FAQ retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAQDto'
        '404':
          description: FAQ não encontrada
    put:
      tags: [AdminPanel]
      summary: Atualiza uma FAQ existente
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateOrUpdateFAQDto'
      responses:
        '200':
          description: FAQ atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FAQDto'
        '404':
          description: FAQ não encontrada
    delete:
      tags: [AdminPanel]
      summary: Desativa uma FAQ (soft-delete)
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: FAQ desativada com sucesso
          content:
            application/json:
              schema:
                type: boolean
        '404':
          description: FAQ não encontrada

  /api/admin/compatibilities:
    get:
      tags: [AdminPanel]
      summary: Matriz de compatibilidade entre 1ª opção (linhas) e 2ª opção (colunas)
      x-roles: [Admin]
      responses:
        '200':
          description: Matriz, cursos ativos e escala de escolaridade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseCompatibilityMatrixDto'
    put:
      tags: [AdminPanel]
      summary: Grava (upsert) as linhas enviadas da matriz e devolve a matriz atualizada
      description: >
        Linhas não enviadas ficam como estão. Célula sem nenhuma das flags interno/externo é
        descartada; linha "não permitida" perde as células.
      x-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCourseCompatibilityMatrixDto'
      responses:
        '200':
          description: Matriz atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseCompatibilityMatrixDto'
        '400':
          description: Curso inexistente, linha/célula/período repetido, condição sem as duas datas, data inicial depois da final ou escolaridade fora da escala

  /api/admin/parameters:
    get:
      tags: [AdminPanel]
      summary: Lista todas as edições do vestibular cadastradas
      x-roles: [Admin]
      responses:
        '200':
          description: Edições retornadas com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VestibularParametersDto'
    post:
      tags: [AdminPanel]
      summary: Cria uma nova edição do vestibular (datas, textos, etc.)
      x-roles: [Admin]
      description: >
        A edição nasce inativa (`isActive=false`); use
        `POST /api/admin/parameters/{id}/activate` para torná-la a edição
        corrente consultada por `GET /api/parameters` e pelos fluxos de
        inscrição/agendamento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateVestibularParametersDto'
      responses:
        '201':
          description: Edição criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VestibularParametersDto'

  /api/admin/parameters/{id}:
    get:
      tags: [AdminPanel]
      summary: Obtém uma edição do vestibular por ID
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Edição retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VestibularParametersDto'
        '404':
          description: Edição não encontrada
    put:
      tags: [AdminPanel]
      summary: Atualiza datas, textos e demais parâmetros de uma edição
      x-roles: [Admin]
      description: >
        `isActive` e `nextEnrollmentNumber` não são editáveis por este
        endpoint — a ativação é feita via
        `POST /api/admin/parameters/{id}/activate` e o contador de protocolo
        é incrementado atomicamente apenas pelo fluxo de inscrição.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateVestibularParametersDto'
      responses:
        '200':
          description: Edição atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VestibularParametersDto'
        '404':
          description: Edição não encontrada

  /api/admin/parameters/{id}/activate:
    post:
      tags: [AdminPanel]
      summary: Marca a edição informada como ativa, desativando as demais
      x-roles: [Admin]
      description: >
        Garante que apenas uma edição do vestibular esteja ativa por vez
        (regra implícita documentada em `specs/modeling.md`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Edição ativada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VestibularParametersDto'
        '404':
          description: Edição não encontrada

  /api/admin/enrollments/dashboard:
    get:
      tags: [AdminPanel]
      summary: Estatísticas do dashboard de inscrições
      x-roles: [Admin]
      description: >
        Total de inscritos, contagem por status, série diária de inscritos e
        contagem por curso/período (considerando apenas a primeira opção).
        Sem `vestibularParametersId`, usa a edição ativa do vestibular.
      parameters:
        - name: vestibularParametersId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Estatísticas retornadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnrollmentDashboardDto'
        '401':
          description: Token inválido ou ausente
        '403':
          description: Token sem Role="Admin"

  /api/admin/enrollments:
    get:
      tags: [AdminPanel]
      summary: Busca/lista inscrições com paginação
      x-roles: [Admin, Secretaria, Financeiro]
      description: >
        O termo em `search` casa com protocolo, nome, CPF (com ou sem máscara) ou e-mail do
        candidato. Sem `vestibularParametersId`, considera **a edição ativa** (todas as edições
        só quando não há nenhuma ativa).
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 'Nome do enum: Open, Validated ou Canceled'
          schema:
            type: string
            enum: [Open, Validated, Canceled]
        - name: pendingPayment
          in: query
          required: false
          description: true traz só inscrições não canceladas com pagamento ainda não confirmado
          schema:
            type: boolean
        - name: vestibularParametersId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 200
      responses:
        '200':
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnrollmentListResultDto'
        '401':
          description: Token inválido ou ausente
        '403':
          description: Token sem Role="Admin"

  /api/admin/enrollments/report:
    get:
      tags: [AdminPanel]
      summary: Mesma busca da listagem, sem paginação, com telefones (relatório Excel)
      x-roles: [Admin, Secretaria]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Open, Validated, Canceled]
        - name: pendingPayment
          in: query
          schema:
            type: boolean
        - name: vestibularParametersId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Linhas do relatório
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminEnrollmentReportItemDto'

  /api/admin/enrollments/{id}:
    delete:
      tags: [AdminPanel]
      summary: Remove definitivamente a inscrição (irreversível)
      description: >
        Apaga o documento — curso, status, dados de prova e campos de pagamento. A conta do
        candidato não é afetada.
      x-roles: [Admin, Secretaria]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inscrição removida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeleteEnrollmentResultDto'
        '404':
          description: Inscrição não encontrada
    get:
      tags: [AdminPanel]
      summary: Obtém os detalhes completos de uma inscrição
      x-roles: [Admin, Secretaria, Financeiro]
      description: >
        Inclui escolhas de curso, status, sala/horário de prova e os dados
        cadastrais completos do candidato dono da inscrição.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inscrição retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnrollmentDetailDto'
        '404':
          description: Inscrição não encontrada
        '401':
          description: Token inválido ou ausente
        '403':
          description: Token sem Role="Admin"

  /api/admin/enrollments/{id}/reset-password:
    post:
      tags: [AdminPanel]
      summary: Reseta a senha do candidato dono da inscrição
      x-roles: [Admin, Secretaria]
      description: >
        Se `newPassword` vier vazio/ausente, uma senha aleatória de 10
        caracteres é gerada e devolvida em `newPassword` na resposta, para o
        admin repassar ao candidato. Liga `mustChangePassword` na conta.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da inscrição (não o id do usuário)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetUserPasswordDto'
      responses:
        '200':
          description: Senha resetada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResetUserPasswordResultDto'
        '404':
          description: Inscrição ou usuário não encontrado
        '401':
          description: Token inválido ou ausente
        '403':
          description: Token sem Role="Admin"

  /api/admin/enrollments/{id}/payment/refresh:
    post:
      tags: [AdminPanel]
      summary: Força a consulta da cobrança PIX no provedor
      description: >
        Mesma consulta da tela do candidato; se confirmar o pagamento, envia o e-mail de confirmação.
      x-roles: [Admin, Secretaria]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Situação atual da cobrança
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPaymentDto'
        '404':
          description: Inscrição não encontrada
        '502':
          description: Provedor de pagamento indisponível

  /api/admin/enrollments/{id}/payment/reset:
    post:
      tags: [AdminPanel]
      summary: Cancela a cobrança PIX vigente
      description: >
        Limpa os campos de pagamento e mantém o correlationID, para a próxima cobrança sair com sufixo. Não confere se a inscrição já está paga.
      x-roles: [Admin, Secretaria]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inscrição atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnrollmentDetailDto'
        '404':
          description: Inscrição não encontrada

  /api/admin/enrollments/{id}/payment/manual:
    post:
      tags: [AdminPanel]
      summary: Registra pagamento recebido fora do PIX
      description: >
        Marca como paga e envia o e-mail de confirmação. Sem `amount`, usa a taxa da edição da
        inscrição já com o desconto do cupom do candidato (mesmas regras da cobrança PIX).
      x-roles: [Admin, Financeiro]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminManualPaymentDto'
      responses:
        '200':
          description: Inscrição atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnrollmentDetailDto'
        '400':
          description: Forma de pagamento inválida, inscrição já paga, cancelada ou sem curso escolhido
        '404':
          description: Inscrição não encontrada

  /api/admin/enrollments/{id}/confirmation-email/resend:
    post:
      tags: [AdminPanel]
      summary: Reenvia o e-mail de confirmação de inscrição
      description: >
        Só com pagamento confirmado. Vai para o candidato e os responsáveis com e-mail válido.
      x-roles: [Admin, Secretaria]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ao menos um destinatário recebeu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResendConfirmationEmailResultDto'
        '400':
          description: Pagamento não confirmado ou nenhum envio deu certo
        '404':
          description: Inscrição não encontrada

  /api/admin/enrollments/{id}/first-choice-options:
    get:
      tags: [AdminPanel]
      summary: Cursos e períodos que o dono da inscrição pode usar como 1ª opção
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Opções
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChoiceCourseOptionDto'
        '404':
          description: Inscrição não encontrada

  /api/admin/enrollments/{id}/second-choice-options:
    get:
      tags: [AdminPanel]
      summary: O que a 1ª opção informada permite como 2ª, para o dono da inscrição
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: firstChoiceCourseCode
          in: query
          required: true
          schema:
            type: integer
        - name: firstChoicePeriodCode
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Opções
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondChoiceOptionsDto'
        '404':
          description: Inscrição não encontrada

  /api/admin/enrollments/{id}/choices:
    put:
      tags: [AdminPanel]
      summary: Troca a 1ª/2ª opção de curso e período
      description: >
        Roda o mesmo validador do candidato sobre o dono da inscrição, mas funciona com inscrição já validada ou paga. Em inscrição paga, reenvia o e-mail de confirmação se o curso ou período mudou.
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateEnrollmentChoicesDto'
      responses:
        '200':
          description: Inscrição atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEnrollmentDetailDto'
        '400':
          description: Recusado pelas regras de inscrição (mesmas mensagens do candidato)
        '404':
          description: Inscrição não encontrada

  # ===================== ADMIN — IMPORTAÇÕES =====================
  /api/admin/imports/enrolled-students:
    post:
      tags: [AdminPanel]
      summary: Importa alunos matriculados (CSV)
      x-roles: [Admin]
      description: >
        Colunas: `nr_ano, id_aluno, ds_cpf, ds_rg, id_curso`. Substitui os anos presentes
        no arquivo; anos ausentes permanecem intactos. O separador é detectado
        automaticamente e as colunas são lidas pelo nome no cabeçalho.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Resultado da importação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultDto'
        '400':
          description: Arquivo ausente ou colunas obrigatórias faltando

  /api/admin/imports/delinquent-students:
    post:
      tags: [AdminPanel]
      summary: Importa alunos inadimplentes (CSV)
      x-roles: [Admin]
      description: >
        Colunas: `nr_ano, id_aluno, ds_cpf, ds_rg, id_curso, nm_curso, qtd_pendentes`
        (`nm_aluno` opcional). Substitui os anos presentes no arquivo; anos ausentes
        permanecem intactos. Alimenta o bloqueio de inscrição por inadimplência (2 ou mais
        pendências no ano da edição ativa menos 1).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Resultado da importação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultDto'
        '400':
          description: Arquivo ausente ou colunas obrigatórias faltando

  /api/admin/imports/former-students:
    post:
      tags: [AdminPanel]
      summary: Importa a base de ex-alunos (CSV)
      x-roles: [Admin]
      description: >
        Colunas: `nm_aluno, ds_cpf, ds_email, nm_responsavel, ds_endereco, ds_bairro, id_curso, nr_ano`
        (obrigatórias: `nm_aluno` e `ds_cpf`; `id_curso` e `nr_ano` são o curso e o ano que o
        ex-aluno cursou). Um registro por CPF: CPF repetido no arquivo vale a última linha. A base não tem ano: a importação é um **upsert
        pelo CPF normalizado** — atualiza quem já existe, insere quem é novo e não remove quem
        não veio no arquivo. Linha sem CPF ou sem nome é pulada com o motivo. Alimenta a regra
        do cupom de desconto (vale só para quem nunca foi aluno).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Resultado da importação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultDto'
        '400':
          description: Arquivo ausente ou colunas obrigatórias faltando

  /api/admin/imports/status:
    get:
      tags: [AdminPanel]
      summary: Situação das coleções importadas
      x-roles: [Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Total de registros e data do último lote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStatusDto'

  /api/admin/enrolled-students:
    get:
      tags: [AdminPanel]
      summary: Lista paginada de alunos matriculados
      x-roles: [Admin]
      parameters:
