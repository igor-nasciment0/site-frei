  /api/admin/coupons:
    get:
      tags: [AdminPanel]
      summary: Lista todos os cupons de desconto, incluindo inativos
      x-roles: [Admin]
      responses:
        '200':
          description: Cupons, do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CouponDto'
    post:
      tags: [AdminPanel]
      summary: Cria um cupom de desconto
      x-roles: [Admin]
      description: >
        O código é gravado normalizado (maiúsculas, sem espaços) e é único, sem diferenciar
        maiúsculas. Percentual: maior que 0 e no máximo 100. Valor fixo: maior que 0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateOrUpdateCouponDto'
      responses:
        '201':
          description: Cupom criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponDto'
        '400':
          description: >
            Código vazio, com mais de 40 caracteres ou repetido; tipo ou valor do desconto
            inválido; validade inicial depois da final; limite de usos menor que 1

  /api/admin/coupons/{id}:
    get:
      tags: [AdminPanel]
      summary: Obtém um cupom por ID, incluindo inativos
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cupom retornado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponDto'
        '404':
          description: Cupom não encontrado
    put:
      tags: [AdminPanel]
      summary: Atualiza um cupom de desconto
      x-roles: [Admin]
      description: >
        `usedCount` não é editável, e o código não pode mudar depois que o cupom já foi usado.
        Cobranças já emitidas não mudam; a alteração vale para as próximas emissões.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateOrUpdateCouponDto'
      responses:
        '200':
          description: Cupom atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponDto'
        '400':
          description: Mesmas validações da criação, ou troca de código de cupom já usado
        '404':
          description: Cupom não encontrado
    delete:
      tags: [AdminPanel]
      summary: Desativa um cupom (soft-delete)
      x-roles: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cupom desativado
          content:
            application/json:
              schema:
                type: boolean
        '404':
          description: Cupom não encontrado

  /api/admin/users/{userId}/rg-document:
    get:
      tags: [AdminPanel]
      summary: Baixa o anexo do RG de um candidato (conferência da secretaria)
      x-roles: [Admin, Secretaria]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Arquivo do documento
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Anexo não encontrado

  # ===================== ADMIN — CONTAS DE CANDIDATOS =====================
  /api/admin/accounts:
    get:
      tags: [AdminPanel]
      summary: Lista as contas de candidatos (coleção users), com busca e paginação
      x-roles: [Admin, Secretaria]
      description: >
        O termo em `search` casa com nome, e-mail ou CPF — o CPF é gravado
        com máscara, mas a busca só por dígitos também encontra. Ordenado pela criação da
        conta, da mais recente para a mais antiga.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 200
      responses:
        '200':
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountListResultDto'
        '401':
          description: Token inválido ou ausente
        '403':
          description: Token sem Role="Admin"

  /api/admin/accounts/{id}:
    get:
      tags: [AdminPanel]
      summary: Dados completos de uma conta de candidato e as inscrições dela
      x-roles: [Admin, Secretaria]
      description: Inclui o histórico de trocas de e-mail e de CPF feitas pelo painel.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDetailDto'
        '404':
          description: Conta não encontrada
        '401':
          description: Token inválido ou ausente
        '403':
          description: Token sem Role="Admin"

  /api/admin/accounts/{id}/reset-password:
    post:
      tags: [AdminPanel]
      summary: Reseta a senha de uma conta de candidato
      x-roles: [Admin, Secretaria]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetUserPasswordDto'
      responses:
        '200':
          description: Senha resetada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResetUserPasswordResultDto'
        '404':
          description: Conta não encontrada

  /api/admin/accounts/{id}/email:
    put:
      tags: [AdminPanel]
      summary: Troca o e-mail de login da conta
      description: >
        Grava normalizado (minúsculas), recusa e-mail de outra conta (ativa ou inativa),
        invalida códigos de recuperação pendentes do e-mail antigo e registra o histórico.
      x-roles: [Admin, Secretaria]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminChangeAccountEmailDto'
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: E-mail inválido, igual ao atual ou já usado por outra conta
        '404':
          description: Conta não encontrada

  /api/admin/accounts/{id}/cpf:
    put:
      tags: [AdminPanel]
      summary: Troca o CPF da conta
      description: >
        Não valida formato nem dígito verificador, de propósito. Recusa CPF de outra conta
        (ativa ou inativa) e registra o histórico.
      x-roles: [Admin, Secretaria]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminChangeAccountCpfDto'
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: CPF vazio, igual ao atual ou já usado por outra conta
        '404':
          description: Conta não encontrada

  # ===================== ADMIN — RELATÓRIOS =====================
  /api/admin/reports/financial:
    get:
      tags: [AdminPanel]
      summary: Relatório financeiro — inscrições pagas da edição ativa, por data de pagamento
      x-roles: [Admin, Financeiro]
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: from
          in: query
          required: true
          description: yyyy-MM-dd, inclusivo, no horário de Brasília
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: yyyy-MM-dd, inclusivo, no horário de Brasília
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Pagamentos do período
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminFinancialReportItemDto'
        '400':
          description: Datas ausentes ou data final anterior à inicial

  /api/admin/reports/referrals:
    get:
      tags: [AdminPanel]
      summary: Relatório de indicações — quem foi indicado, por quem, e a inscrição de cada um
      x-roles: [Admin, Secretaria]
      description: >
        Uma linha por conta que informou quem a indicou (etapa 8). Traz a inscrição do indicado
        e, quando o CPF informado é o de uma conta do portal, a de quem indicou — ambas na edição
        ativa. Sem paginação.
      parameters:
        - name: search
          in: query
          description: Nome, CPF ou protocolo, do indicado ou de quem indicou
          schema:
            type: string
      responses:
        '200':
          description: Indicações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminReferralReportItemDto'

  /api/admin/reports/coupons:
    get:
      tags: [AdminPanel]
      summary: Relatório de cupons — inscrições da edição ativa com desconto, valor cheio e valor pago
      x-roles: [Admin, Secretaria]
      description: >
        Inscrições em que o desconto do cupom entrou numa cobrança ou num pagamento (cupom só
        aplicado na etapa 8, sem cobrança emitida, não aparece). Sem paginação.
      parameters:
        - name: search
          in: query
          description: Nome, CPF ou protocolo
          schema:
            type: string
        - name: code
          in: query
          description: Código do cupom
          schema:
            type: string
      responses:
        '200':
          description: Inscrições com cupom
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCouponReportItemDto'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Enviar como `Authorization: Bearer <token>`. Candidato: token de
        `POST /api/users/login`, validade de 4 meses, claim `Role="User"`.
        Painel: token de `POST /api/admin/auth/login`, validade de 8 horas,
        claim `Role` = `Admin`, `Secretaria` ou `Financeiro`.

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        error:
          type: string

    # -------- Users --------
    CreateUserCommand:
      type: object
      required: [name, cpf, birthDate, password, email]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        cpf:
          type: string
          description: Formato "000.000.000-00" (ou apenas dígitos), 11–14 caracteres.
          minLength: 11
          maxLength: 14
        birthDate:
          type: string
          format: date-time
          description: Deve estar no passado e não mais que 120 anos atrás.
        password:
          type: string
          minLength: 6
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150

    LoginCommand:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponseDto:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
          description: Gerado mas ainda sem endpoint/persistência para uso (funcionalidade incompleta).
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserDto'

    UpdateUserDto:
      type: object
      description: Todos os campos são opcionais — apenas os enviados (não nulos) são atualizados.
      properties:
        name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
        address:
          $ref: '#/components/schemas/AddressDto'
        birthInfo:
          $ref: '#/components/schemas/BirthInfoDto'
        generalInfo:
          $ref: '#/components/schemas/GeneralInfoDto'
        rgInfo:
          $ref: '#/components/schemas/RgInfoDto'
        primaryResponsible:
          $ref: '#/components/schemas/ResponsibleDto'
        secondaryResponsible:
          $ref: '#/components/schemas/ResponsibleDto'
        schoolInfo:
          $ref: '#/components/schemas/SchoolInfoDto'
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfoDto'
        watchInstitutionVideo:
          type: boolean
          nullable: true
          description: Só grava quando enviado. Marca que o candidato assistiu o vídeo institucional até o fim.
        referral:
          allOf:
            - $ref: '#/components/schemas/ReferralDto'
          nullable: true
          description: >
            Indicação (etapa 8). Nulo = não mexe; nome e CPF vazios = limpa; preenchendo um, os
            dois são obrigatórios. Ignorado com `allowReferral` desligado na edição ativa.

    ReferralDto:
      type: object
      description: Quem indicou o candidato para o Instituto.
      properties:
        name:
          type: string
          maxLength: 100
        cpf:
          type: string
          description: Aceito com ou sem máscara (11 dígitos); gravado e devolvido só com dígitos.
          example: '12345678901'

    AppliedCouponDto:
      type: object
      description: Cupom gravado no usuário. Desconto e valor final vêm de `GET /api/users/coupon`.
      properties:
        code:
          type: string
        appliedAt:
          type: string
          format: date-time

    ApplyCouponDto:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Código do cupom; maiúsculas/minúsculas e espaços são ignorados.

    CouponDiscountType:
      type: integer
      enum: [1, 2]
      description: 1 = percentual sobre a taxa; 2 = valor fixo em reais. Serializado como número.

    CouponValidationDto:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
          description: Motivo da recusa, ou a confirmação quando `valid = true`.
        code:
          type: string
          nullable: true
        discountType:
          allOf:
            - $ref: '#/components/schemas/CouponDiscountType'
          nullable: true
        discountValue:
          type: number
          format: double
          nullable: true
          description: Percentual ou valor fixo cadastrado no cupom.
        originalFee:
          type: number
          format: double
          nullable: true
          description: Taxa de inscrição da edição ativa.
        discountAmount:
          type: number
          format: double
          nullable: true
          description: Desconto em reais (2 casas; nunca maior que a taxa).
        finalFee:
          type: number
          format: double
          nullable: true

    ChangePasswordDto:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    UpdateDeviceInfoDto:
      type: object
      properties:
        deviceId:
          type: string
        deviceModel:
          type: string
        operatingSystem:
          type: string
        osVersion:
          type: string
        appVersion:
          type: string
        firebaseToken:
          type: string

    RequestPasswordRecoveryDto:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordDto:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: Código numérico de 6 dígitos, válido por 15 minutos.
        newPassword:
          type: string

    PasswordRecoveryResponseDto:
      type: object
      properties:
        message:
          type: string
        success:
          type: boolean

    UserDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        cpf:
          type: string
        gender:
          type: string
        address:
          $ref: '#/components/schemas/AddressDto'
        birthInfo:
          $ref: '#/components/schemas/BirthInfoDto'
        generalInfo:
          $ref: '#/components/schemas/GeneralInfoDto'
        rgInfo:
          $ref: '#/components/schemas/RgInfoDto'
        primaryResponsible:
          $ref: '#/components/schemas/ResponsibleDto'
        secondaryResponsible:
          $ref: '#/components/schemas/ResponsibleDto'
        schoolInfo:
          $ref: '#/components/schemas/SchoolInfoDto'
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfoDto'
        age:
          type: integer
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
          description: Senha resetada pelo painel — o candidato precisa trocá-la antes de usar o portal.
        watchInstitutionVideo:
          type: boolean
        referral:
          allOf:
            - $ref: '#/components/schemas/ReferralDto'
          nullable: true
          description: Quem indicou o candidato. Nulo quando não informado.
        coupon:
          allOf:
            - $ref: '#/components/schemas/AppliedCouponDto'
          nullable: true
          description: Cupom de desconto aplicado pelo candidato. Nulo quando não há.

    AddressDto:
      type: object
      properties:
        cep:
          type: string
        street:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
        number:
          type: string
        complement:
          type: string

    BirthInfoDto:
      type: object
      properties:
        date:
          type: string
          format: date-time
        city:
          type: string
        state:
          type: string
        country:
          type: string

    GeneralInfoDto:
      type: object
      properties:
        howDidYouKnow:
          type: string
        income:
          type: number
          format: decimal
        peopleAtHome:
          type: integer
        peopleWorking:
          type: integer

    RgInfoDto:
      type: object
      properties:
        number:
          type: string
        issueDate:
          type: string
          format: date-time
        issuingAuthority:
          type: string
        hasDocument:
          type: boolean
          description: Indica se o candidato já anexou a foto do RG (obrigatória para inscrever).
        documentUploadedAt:
          type: string
          format: date-time
          nullable: true

    RgDocumentDto:
      type: object
      properties:
        hasDocument:
          type: boolean
        contentType:
          type: string
          nullable: true
        uploadedAt:
          type: string
          format: date-time
          nullable: true

    ResponsibleDto:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        phoneSecondary:
          type: string
        relationship:
          type: string

    SchoolInfoDto:
      type: object
      properties:
        currentSchool:
          type: string
        currentGrade:
          type: string
        schoolType:
          type: string

    DeviceInfoDto:
      type: object
      properties:
        deviceId:
          type: string
        deviceModel:
          type: string
        operatingSystem:
          type: string
        osVersion:
          type: string
        appVersion:
          type: string
        firebaseToken:
          type: string
        lastSeen:
          type: string
          format: date-time

    # -------- Courses --------
    CourseSummaryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        workload:
          type: string
        imageId:
          type: string
          description: Identificador usado em `GET /api/courses/{id}/image`.
        type:
          type: string
          description: Default "Livre" quando nulo na base.
        code:
          type: integer
        ordenacao:
          type: integer
          description: Posição nas listagens (menor primeiro; empate pelo nome).

    CourseCountDto:
      type: object
      properties:
        total:
          type: integer
          format: int64
          description: Quantidade de cursos com `isActive = true`.

    CourseDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        code:
          type: integer
        availablePeriods:
          type: array
          items:
            $ref: '#/components/schemas/CoursePeriodDto'
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectDto'
        minAge:
          type: string
          description: Texto livre (não numérico).
        maxAge:
          type: string
          description: Texto livre (não numérico).
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        workload:
          type: string
        jobMarket:
          type: string
        contribution:
          type: string
        minSchoolLevel:
          type: string
        apresentationVideoUrl:
          type: string
        image:
          type: string

    CoursePeriodDto:
      type: object
      properties:
        code:
          type: integer
        name:
          type: string
        entryTime:
          type: string
          example: "08:00"
        exitTime:
          type: string
          example: "17:30"
        isActive:
          type: boolean

    SubjectDto:
      type: object
      properties:
        code:
          type: integer
        name:
          type: string

    # -------- Enrollments --------
    CreateEnrollmentDto:
      type: object
      required: [firstChoiceCourseCode, firstChoicePeriodCode]
      properties:
        firstChoiceCourseCode:
          type: integer
        firstChoicePeriodCode:
          type: integer
        secondChoiceCourseCode:
          type: string
          description: >
            Enviado como string; vazio/omitido quando o candidato não escolhe
            segunda opção (só aceito se a matriz de compatibilidade não a exigir).
        secondChoicePeriodCode:
          type: string

    EnrollmentChoicesValidationDto:
      type: object
      properties:
        compativel:
          type: boolean
        mensagem:
          type: string
          nullable: true
          description: Primeira mensagem de validação que falhou, ou nulo se `compativel = true`.

    ChoiceCourseOptionDto:
      type: object
      description: Curso e os períodos dele que o candidato pode escolher (1ª ou 2ª opção).
      properties:
        courseCode:
          type: integer
        periodCodes:
          type: array
          items:
            type: integer

    SecondChoiceRequirement:
      type: integer
      enum: [1, 2, 3]
      description: "1=Required (obrigatória), 2=Optional (opcional), 3=NotAllowed (não permitida)"

    SecondChoiceOptionsDto:
      type: object
      properties:
        configured:
          type: boolean
          description: Falso quando a 1ª opção ainda não tem linha na matriz — curso bloqueado.
        secondChoiceRequirement:
          $ref: '#/components/schemas/SecondChoiceRequirement'
        options:
          type: array
          description: Inclui o próprio curso da 1ª opção quando a diagonal libera outro período dele.
          items:
            $ref: '#/components/schemas/ChoiceCourseOptionDto'

    EnrollmentDto:
      type: object
      description: >
        `isInternalStudent`, `resultPublicationDate`, `roomNoticeEmailDate`, `paymentStatus`,
        `paymentPaidAt` e os campos de prova só vêm preenchidos em `GET /my-enrollment`; as
        respostas de `POST /enrollments` e `GET /protocol/{protocol}` trazem só os dados básicos.
        `firstChoice.courseCode = 0` indica opções de curso canceladas (o candidato precisa escolher de novo).
      properties:
        id:
          type: string
        protocol:
          type: string
          description: "Formato {ano}{sequencial:D4}; o contador começa em 1001."
          example: "20261001"
        userId:
          type: string
        vestibularParametersId:
          type: string
        firstChoice:
          $ref: '#/components/schemas/CourseChoiceDto'
        secondChoice:
          $ref: '#/components/schemas/CourseChoiceDto'
        testDate:
          type: string
          format: date-time
        testRoom:
          type: string
          nullable: true
        testTime:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
        isInternalStudent:
          type: boolean
          description: >
            Candidato que já é aluno da casa e escolheu a continuidade do próprio curso de
            inglês — faz nivelamento na turma em vez da prova do vestibular.
        resultPublicationDate:
          type: string
          format: date-time
          description: >
            Data de divulgação do resultado **deste candidato**. Candidato externo em curso de
            continuidade recebe a data alternativa da edição. Prefira este campo à data global
            de `GET /api/parameters`.
        roomNoticeEmailDate:
          type: string
          format: date-time
          nullable: true
          description: Data em que horário e sala da prova são enviados por e-mail.
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        paymentPaidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    PaymentStatus:
      type: integer
      enum: [1, 2, 3, 4, 5]
      description: "1=Pending, 2=Paid, 3=Expired, 4=Failed, 5=Canceled"

    EnrollmentPaymentDto:
      type: object
      properties:
        correlationId:
          type: string
          nullable: true
          description: Identificador da cobrança no provedor. Nulo antes da emissão.
          example: insfvest_202620261001
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: number
          format: double
        copyPasteCode:
          type: string
          nullable: true
          description: Código PIX copia-e-cola.
        qrCodeImageUrl:
          type: string
          nullable: true
          description: URL da imagem do QR code, servida pelo provedor.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        couponCode:
          type: string
          nullable: true
          description: Cupom aplicado a esta cobrança. Nulo = valor cheio.
        originalAmount:
          type: number
          format: double
          nullable: true
          description: Taxa antes do desconto. Só vem com `couponCode`.
        discountAmount:
          type: number
          format: double
          nullable: true
          description: Desconto do cupom. Só vem com `couponCode`.
        couponNotice:
          type: string
          nullable: true
          description: O cupom do candidato deixou de valer na emissão e a cobrança saiu pelo valor cheio (código e motivo).

    ImportResultDto:
      type: object
      properties:
        totalRows:
          type: integer
          description: Linhas de dados no arquivo (sem o cabeçalho).
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportRowErrorDto'

    ImportRowErrorDto:
      type: object
      properties:
        line:
          type: integer
          description: Número da linha no arquivo, contando o cabeçalho como linha 1.
        reason:
          type: string

    ImportStatusDto:
      type: object
      properties:
        enrolledStudents:
          $ref: '#/components/schemas/ImportCollectionStatusDto'
        delinquentStudents:
          $ref: '#/components/schemas/ImportCollectionStatusDto'
        formerStudents:
          $ref: '#/components/schemas/ImportCollectionStatusDto'

    ImportCollectionStatusDto:
      type: object
      properties:
        totalRecords:
          type: integer
          format: int64
        lastImportAt:
          type: string
          format: date-time
          nullable: true

    CourseChoiceDto:
      type: object
      properties:
        courseCode:
          type: integer
        courseName:
          type: string
        periodCode:
          type: integer
        periodName:
          type: string

    EnrollmentStatus:
      type: integer
      enum: [1, 2, 3]
      description: "1=Open (editável), 2=Validated (imutável), 3=Canceled (imutável)"

    # -------- Appointments --------
    CreateOrUpdateAppointmentCommand:
      type: object
      required: [appointmentDateTime]
      properties:
        appointmentDateTime:
          type: string
          format: date-time
          description: Deve ser futura, em dia útil e horário comercial (08:00–17:30).

    AppointmentResponseDto:
      type: object
      properties:
        id:
          type: string
        appointmentDate:
          type: string
          format: date-time
        startTime:
          type: string
          example: "09:00"
        endTime:
          type: string
          example: "10:00"
        notes:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    AppointmentStatus:
      type: integer
      enum: [1, 2, 3, 4]
      description: >
        1=Scheduled (único valor efetivamente usado hoje), 2=Confirmed,
        3=Cancelled, 4=Completed (sem transição implementada em código).

    AvailableAppointmentDatesDto:
      type: object
      properties:
        availableDates:
          type: array
          items:
            type: string
            format: date-time
        totalDays:
          type: integer
        enrollmentEndDate:
          type: string
          format: date-time
          nullable: true

    # -------- FAQs --------
    FAQDto:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
          nullable: true
          description: >
            Slug estável para link direto (`/faq?q=<key>`), ex.: `edital-bolsa`.
            Preferível ao índice (muda ao reordenar) e ao id (difere entre ambientes).
        question:
          type: string
        answer:
          type: string
        order:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    # -------- Parameters --------
    VestibularStatusDto:
      type: object
      properties:
        year:
          type: integer
          description: Ano da edição ativa.
        allowRegistration:
          type: boolean
          description: Valor bruto do interruptor do admin, sem considerar a janela de datas.
        allowReferral:
          type: boolean
          description: A edição ativa aceita indicação — o front mostra a seção "Indicação" na etapa 8.
        allowCoupon:
          type: boolean
          description: A edição ativa aceita cupom — o front mostra a seção "Cupom de desconto" na etapa 8.
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        extensionDate:
          type: string
          format: date-time
          nullable: true
        resultPublicationDate:
          type: string
          format: date-time
        resultUrl:
          type: string
        message:
          type: string
        description:
          type: string
        presentationVideoUrl:
          type: string
        isRegistrationOpen:
          type: boolean
        canShowResultUrl:
          type: boolean
        daysUntilStart:
          type: integer
        daysUntilEnd:
          type: integer
        currentPhase:
          $ref: '#/components/schemas/VestibularPhase'

    VestibularPhase:
      type: integer
      enum: [0, 1, 2, 3]
      description: >
        Serializado como número: 0=NotStarted, 1=RegistrationOpen, 2=RegistrationClosed,
        3=Finished. O serviço só devolve 0, 1 e 3 — o valor 2 existe no enum mas nunca é
        atribuído. O frontend trava o formulário de dados pessoais com `currentPhase >= 3`.

    # -------- Admin Panel --------
    AdminLoginCommand:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    BootstrapAdminCommand:
      type: object
      required: [username, email, name, password, accessPassword]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 8
        accessPassword:
          type: string
          description: Segredo de bootstrap (`AccessPassword.Admin`).

    CreateAdminUserCommand:
      type: object
      required: [username, email, name, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 8
        role:
